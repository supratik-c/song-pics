<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scribble Bops</title>
    <link rel="stylesheet" href="./src/styles.css" />
    <script type="module" src="./src/main.ts"></script>
  </head>
  <body>
    <main class="shell">
      <div class="comic-page">
        <header class="masthead">
          <div class="title-panel">
            <h1>Scribble Bops</h1>
            <p class="intro">Guess today's song from these highly professional drawings.</p>
            <div class="header-controls">
              <button
                class="header-icon-button all-issues-button tactile-button"
                id="all-issues-button"
                type="button"
                disabled
              >
                <img
                  class="all-issues-icon"
                  src="./src/assets/ui/icons/all-issues.svg"
                  alt=""
                  aria-hidden="true"
                />
                <span class="visually-hidden">All Issues</span>
              </button>
              <button
                class="header-icon-button how-to-play-button tactile-button"
                id="how-to-play-button"
                type="button"
              >
                <span class="how-to-play-icon" aria-hidden="true">?</span>
                <span class="visually-hidden">How to Play</span>
              </button>
            </div>
          </div>
        </header>

        <section class="game" aria-labelledby="puzzle-song-clue">
          <div class="game-header">
            <p class="eyebrow" id="puzzle-date"></p>
            <h2 id="puzzle-song-clue"></h2>
          </div>

          <div class="clue-panel-area">
            <div
              class="panels is-loading"
              id="panels"
              aria-label="Loading clue panels"
              aria-busy="true"
            >
              <p
                class="loading-indicator loading-indicator-large"
                role="status"
                aria-live="polite"
                aria-atomic="true"
                style="--loading-note-stagger: 180ms"
              >
                <span
                  class="loading-indicator-note loading-indicator-note-leading"
                  aria-hidden="true"
                >♪</span>
                <span class="loading-indicator-label">Scribbling...</span>
                <span
                  class="loading-indicator-note loading-indicator-note-trailing"
                  aria-hidden="true"
                >♪</span>
              </p>
            </div>
            <p class="doodle-credit" id="doodle-credit" hidden></p>
          </div>

          <form class="guess-form" id="guess-form" novalidate hidden>
            <div class="guess-entry-panel">
              <label for="guess-input">What's the song?</label>
              <input
                id="guess-input"
                name="guess"
                type="text"
                autocomplete="off"
                placeholder="Type your guess"
                required
              />
            </div>

            <p
              class="validation-message"
              id="validation-message"
              role="status"
              aria-live="polite"
              hidden
            ></p>

            <div class="action-grid">
              <button class="comic-action tactile-button guess-button" type="submit">
                <span>Guess</span>
              </button>

              <div class="artist-action-cell">
                <button
                  class="comic-action tactile-button artist-reveal-button"
                  id="reveal-artist-button"
                  type="button"
                >
                  <span>Reveal Artist</span>
                </button>
                <p class="artist-hint" id="artist-hint" aria-live="polite" hidden></p>
              </div>

              <p class="attempts" id="attempts-count" aria-live="polite"></p>

              <button
                class="comic-action tactile-button reveal-song-button"
                id="reveal-song-button"
                type="button"
              >
                <span>Reveal Song</span>
              </button>
            </div>
          </form>

          <section
            class="result-region"
            id="result-region"
            aria-labelledby="puzzle-result-title"
            tabindex="-1"
            hidden
          ></section>

          <p class="message" id="message" aria-live="polite"></p>
          <ol class="guess-list" id="guess-list" aria-label="Previous guesses"></ol>
          <div class="share-region" id="share-region" hidden></div>
        </section>
      </div>

      <footer class="site-footer">
        <a href="%BASE_URL%legal.html">The Legal Stuff</a>
      </footer>
    </main>

    <dialog
      class="comic-dialog"
      id="game-dialog"
      aria-labelledby="game-dialog-title"
    >
      <header class="comic-dialog-header">
        <h2 id="game-dialog-title"></h2>
        <button
          class="comic-dialog-close tactile-button"
          id="game-dialog-close"
          type="button"
          aria-label="Close popup"
        >
          <span aria-hidden="true">×</span>
        </button>
      </header>
      <div class="comic-dialog-body" id="game-dialog-body"></div>
    </dialog>
  </body>
</html>
