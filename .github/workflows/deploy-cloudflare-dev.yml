name: Deploy Cloudflare (dev preview)

# dev.scribblebops.com is a private preview behind Cloudflare Access, built
# from pull requests so changes are checkable before they merge to main.
# scribblebops.com production (deploy-cloudflare.yml) only deploys from main.
on:
  pull_request:
    paths:
    - 'client/**'
    - '.github/workflows/deploy-cloudflare-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-dev
  # A newer push to the same PR supersedes its own in-flight preview.
  cancel-in-progress: true

jobs:
  deploy:
    # Fork PRs cannot read repository secrets; skip rather than fail confusingly.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Preserve the current GitHub Actions release-date boundary explicitly.
      TZ: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Typecheck
        working-directory: client
        run: npm run typecheck

      - name: Test
        working-directory: client
        run: npm test

      - name: Install WebP tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes webp

      - name: Convert images to WebP
        working-directory: client
        run: bash scripts/convert.sh

      - name: Build for the dev preview
        working-directory: client
        env:
          VITE_BASE_PATH: /
          VITE_BUILD_ID: ${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          VITE_PUBLIC_SITE_URL: https://dev.scribblebops.com/
        run: npm run build

      # Same secrets as deploy-cloudflare.yml; --env dev selects the
      # scribble-bops-dev Worker and dev.scribblebops.com route from
      # client/wrangler.jsonc. Access to dev.scribblebops.com is Cloudflare
      # dashboard configuration (Zero Trust Access), not a repository secret.
      - name: Deploy static assets to the Cloudflare dev preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: client
          wranglerVersion: "4.81.0"
          command: deploy --env dev
