name: Deploy Pages (standby)

# scribblebops.com on Cloudflare (deploy-cloudflare.yml) is production. This
# workflow keeps GitHub Pages building in parallel as a warm standby in case
# Cloudflare or the domain has an incident.
on:
  push:
    branches: [main]
    paths:
    - 'client/**'
    - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Typecheck
        working-directory: client
        run: npm run typecheck

      - name: Test
        working-directory: client
        run: npm test

      - name: Install WebP tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes webp
      
      - name: Convert images to WebP
        working-directory: client
        run: bash scripts/convert.sh

      - name: Build
        working-directory: client
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_BUILD_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          # scribblebops.com is canonical; this standby mirror's OG/canonical
          # metadata points at it rather than at itself.
          VITE_PUBLIC_SITE_URL: https://scribblebops.com/
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
