name: Deploy Cloudflare

# scribblebops.com is served by this workflow. GitHub Pages (deploy-pages.yml)
# keeps building in parallel as a warm standby. Currently disabled awaiting setting up a Cloudflare account.
on:
  # push:
  #   branches: [main]
  #   paths:
  #   - 'client/**'
  #   - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Preserve the current GitHub Actions release-date boundary explicitly.
      TZ: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Typecheck
        working-directory: client
        run: npm run typecheck

      - name: Test
        working-directory: client
        run: npm test

      - name: Install WebP tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes webp

      - name: Convert images to WebP
        working-directory: client
        run: bash scripts/convert.sh

      - name: Build for a domain-root deployment
        working-directory: client
        env:
          VITE_BASE_PATH: /
          VITE_BUILD_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          VITE_PUBLIC_SITE_URL: https://scribblebops.com/
        run: npm run build

      # Before running this workflow, create these GitHub Actions secrets:
      # - CLOUDFLARE_API_TOKEN: a narrowly scoped "Edit Cloudflare Workers" token.
      # - CLOUDFLARE_ACCOUNT_ID: the account ID shown in the Cloudflare dashboard.
      # The canonical Worker name is configured in client/wrangler.jsonc.
      #
      # --env "" targets the top-level (production) environment explicitly.
      # Wrangler otherwise warns that the target is ambiguous now that
      # client/wrangler.jsonc also defines a "dev" environment.
      - name: Deploy static assets to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: client
          wranglerVersion: "4.81.0"
          command: deploy --env ""
